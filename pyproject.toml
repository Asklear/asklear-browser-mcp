[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asklear-browser-mcp"
version = "0.1.1"
description = "Local browser collection gateway for Asklear — stdio MCP server that drives your Chrome via the Asklear extension"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "websockets>=13",
]

[project.scripts]
asklear-browser-agent = "asklear_browser_mcp.adapter:main"
asklear-browser-connector = "asklear_browser_mcp.connector:main"

[tool.hatch.build.targets.wheel]
packages = ["asklear_browser_mcp"]
