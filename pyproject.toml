[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asklear-browser-mcp"
version = "0.1.0"
description = "Local browser collection gateway for Asklear — stdio MCP server that drives your Chrome via the Asklear extension"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
asklear-browser-mcp = "asklear_browser_mcp.adapter:main"

[tool.hatch.build.targets.wheel]
packages = ["asklear_browser_mcp"]
