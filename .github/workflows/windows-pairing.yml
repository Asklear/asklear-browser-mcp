name: Windows pairing

on: [push, pull_request]

jobs:
  pairing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest
      - run: python -m pytest tests/test_secure_channel.py tests/test_installation_contract.py -q
